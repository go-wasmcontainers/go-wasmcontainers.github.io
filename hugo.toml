baseURL = "https://go-wasmcontainers.github.io/"
title = "go-wasmcontainers"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# The design -- layouts/partials/styles.html, theme-toggle.html,
# fork-ribbon.html and icons/{github,book}.html -- comes from the shared Hugo
# module github.com/go-fleettools/landingkit, not from copies here: the copies
# drifted. Its version is pinned in go.mod (Renovate bumps it), and kit.go
# keeps `go mod tidy` from deleting that requirement. A file of the same name
# under layouts/partials/ would silently override the module's.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

# The brand: READ from static/img/logo.svg by `landingkit brand`, never chosen.
[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 4.88:1, bright on the dark background 9.94:1.
  base = "#0079a8"
  deep = "#004a66"
  bright = "#22cce2"
  shadow = "rgba(0,121,168,.7)"
  glow = "rgba(0,121,168,.6)"
  wash = "rgba(0,121,168,.10)"
  washDeep = "rgba(0,74,102,.06)"
  chipBg = "#e4f9fc"
  chipBorder = "#bdf0f6"
  chipFg = "#004a66"
  chipBgDark = "rgba(34,204,226,.14)"
  chipBorderDark = "rgba(34,204,226,.32)"
  chipFgDark = "#85e3ef"
  statsEnd = "#caf3f8"
  bandText = "#dcf7fa"

# Each repo card. Everything here is what the repository's own description and
# status say today; "status" is the release or "planned", and only what a
# release carries is marked shipped.
# "blurb" = drawn from the repository's README / description.
[[params.repos]]
  name = "engine"
  status = "v0.10.0 released"
  blurb = "The `wctrd` daemon and the `wctr` command: a container engine for WASI (`wasip1`) workloads, compatible with the Docker Engine API, in pure Go. **v0.10.0** adds networking: guests get sockets (a stock Go program using stealthrocket/net runs unchanged), built-in DNS by container name, the networks `bridge` and `none` (`wctr network create|ls|inspect|rm`, `run --network`), and a class network through the relay (`wctrd --relay`); `wctrd --wasi engine` is now the default. Not in the playground yet. v0.9.0 pulls `tar+zstd` layers (bounded, fuzzed) and enables WebAssembly exception handling natively; v0.8.0 adds named volumes (`wctr volume create|ls|inspect|rm|prune`, `run -v NAME:/path[:ro]`; host paths are refused); **v0.7.0** `wctr stats` (memory against its limit, bytes written, pids; CPU is not measured); **v0.6.0** `wctr events` / `GET /events`; v0.5.0 adds `wctr start`, `stop` and `restart`; **v0.4.0** made containers survive a `wctrd` restart and a page reload (running ones come back exited 137) and added `wctr system df`, `system prune` and `diff`; v0.3.0 adds `wctr completion bash|zsh|fish|powershell` and `cli/lineedit`, a pure-Go line editor with completion. It runs natively on Linux and macOS with a wazero executor (since v0.1.0): `wctr pull`, `images`, `run`, `ps`, `logs`, `rm`, `rmi`, `inspect`, `kill` and `version`, against an OCI image layout or a registry; v0.2.0 adds the browser executor (`runtime/browser`), the shared WASI host (`wasi`), `api/inproc`, the `cli` package and `RegistryOptions.Mirrors`. No `exec`, attach or build yet, and no published ports. Install with `go install github.com/go-wasmcontainers/engine/cmd/wctr@v0.10.0` (and `cmd/wctrd`)."

[[params.repos]]
  name = "relay"
  status = "v0.2.0 released"
  blurb = "`wctr-relay`, the classroom relay and firewall: students' engines connect to it over one secure WebSocket; it gives every container an address and a DNS name and checks every flow against security groups modelled on OpenStack Neutron (default deny, both ends, stateful), with a gRPC control API (Connect) and OpenID Connect sign-in. **v0.2.0** adds the [live flow map](https://go-wasmcontainers.github.io/docs/latest/relay/flowmap/): a page the relay serves that draws who talks to whom, refused flows in red, tested in Chromium and Firefox. The engine's network driver and the browser path are next. Binaries (with the flow map) on the [releases](https://github.com/go-wasmcontainers/relay/releases) page."

[[params.repos]]
  name = "dashboard"
  status = "v0.3.0 released, live demo"
  blurb = "A graphical dashboard for the engine — containers, images, volumes and a `wctr` terminal — built with go-widgets, running in the browser on the same engine and API as `wctr`; every action shows the `wctr` command it stands for. [Live demo](https://go-wasmcontainers.github.io/dashboard/). **v0.3.0** runs on engine v0.8.0: it follows `GET /events` instead of polling, has a Volumes view (create, inspect, remove, prune, each showing its `wctr volume` line), a Stats tab per container (memory against its limit, bytes written, log size, pids; CPU `--` as it is not measured), and `-v NAME:/path[:ro]` in the run dialog; tested live in Chromium and Firefox. Start, Stop and Restart use `/start`, `/stop` and `/restart`. The standalone demo keeps its state in memory (nothing persists across a reload). It is now the default UI of the [live playground](https://go-wasmcontainers.github.io/playground/), on its persistent engine worker (the terminal-only page stays at `?ui=terminal`); the page is slower to be ready with it (1070 ms against 728 ms in Chromium), and a size reduction is in progress."

[[params.repos]]
  name = "playground"
  status = "v0.2.0 released, live"
  blurb = "An in-browser container playground: [a terminal that runs `wctr`](https://go-wasmcontainers.github.io/playground/) against WASI containers, with no server, for cloud and container training labs. **v0.2.0** runs engine v0.9.0 with completion, persistence and offline use: `pull`, `run` (with `-v` volumes), `ps`, `logs`, `rm`, `rmi`, `images`, `inspect`, `kill`, `start`, `stop`, `restart`, `diff`, `stats`, `events`, `volume` and `system df|prune`, with the images `hello`, `greet`, `lab`, `age`, `go-md2man`, `shfmt` and the C tools `lua`, `sqlite3` and `minigzip` kept in the browser across reloads. On the live site it now opens the dashboard (Containers, Images, Volumes, Terminal) by default, not yet in a tag (the latest is v0.2.0). No stdin, shell or networking yet."

# What is planned, as one list so the page's counts are derived from it and
# never typed beside it.
[[params.planned]]
  name = "Networking in the playground"
  what = "Engine v0.10.0 has networking (sockets, DNS by container name, networks); it is not live in the playground yet. The next milestone."

[[params.planned]]
  name = "Classroom relay"
  what = "The relay and its live flow map shipped (relay v0.1.0, v0.2.0); planned: containers in the playground reaching each other through it (the engine's network driver and the browser path), and high availability across relays. [Relay docs](https://go-wasmcontainers.github.io/docs/latest/relay/), [design](https://go-wasmcontainers.github.io/docs/latest/design/classroom-network/)."

[[params.planned]]
  name = "A shell and exec"
  what = "`wctr exec` and an interactive shell, through a WASIX subset."

[[params.planned]]
  name = "Image build"
  what = "Building an image from a Dockerfile."

[[params.planned]]
  name = "Compose"
  what = "Several containers described in one file."

[[params.planned]]
  name = "A mini-Kubernetes"
  what = "Enough of the orchestrator's API to teach its concepts."

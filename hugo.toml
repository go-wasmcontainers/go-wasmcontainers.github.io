baseURL = "https://go-wasmcontainers.github.io/"
title = "go-wasmcontainers"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# The design -- layouts/partials/styles.html, theme-toggle.html,
# fork-ribbon.html and icons/{github,book}.html -- comes from the shared Hugo
# module github.com/go-fleettools/landingkit, not from copies here: the copies
# drifted. Its version is pinned in go.mod (Renovate bumps it), and kit.go
# keeps `go mod tidy` from deleting that requirement. A file of the same name
# under layouts/partials/ would silently override the module's.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

# The brand: READ from static/img/logo.svg by `landingkit brand`, never chosen.
[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 4.88:1, bright on the dark background 9.94:1.
  base = "#0079a8"
  deep = "#004a66"
  bright = "#22cce2"
  shadow = "rgba(0,121,168,.7)"
  glow = "rgba(0,121,168,.6)"
  wash = "rgba(0,121,168,.10)"
  washDeep = "rgba(0,74,102,.06)"
  chipBg = "#e4f9fc"
  chipBorder = "#bdf0f6"
  chipFg = "#004a66"
  chipBgDark = "rgba(34,204,226,.14)"
  chipBorderDark = "rgba(34,204,226,.32)"
  chipFgDark = "#85e3ef"
  statsEnd = "#caf3f8"
  bandText = "#dcf7fa"

# Each repo card. Everything here is what the repository's own description and
# status say today; "status" is the release or "planned", and only what a
# release carries is marked shipped.
# "blurb" = drawn from the repository's README / description.
[[params.repos]]
  name = "engine"
  status = "v0.2.0 released"
  blurb = "The `wctrd` daemon and the `wctr` command: a container engine for WASI (`wasip1`) workloads, compatible with the Docker Engine API, in pure Go. **v0.2.0** runs natively on Linux and macOS with a wazero executor (since v0.1.0): `wctr pull`, `images`, `run`, `ps`, `logs`, `rm`, `rmi`, `inspect`, `kill` and `version`, against an OCI image layout or a registry; v0.2.0 adds the browser executor (`runtime/browser`), the shared WASI host (`wasi`), `api/inproc`, the `cli` package and `RegistryOptions.Mirrors`. No networking, `exec`, attach or build yet. Install with `go install github.com/go-wasmcontainers/engine/cmd/wctr@v0.2.0` (and `cmd/wctrd`)."

[[params.repos]]
  name = "relay"
  status = "v0.1.0 released"
  blurb = "`wctr-relay`, the classroom relay and firewall: students' engines connect to it over one secure WebSocket; it gives every container an address and a DNS name and checks every flow against security groups modelled on OpenStack Neutron (default deny, both ends, stateful), with a flow log, a gRPC control API (Connect) and OpenID Connect sign-in. **v0.1.0** ships milestones M-relay-1 and M-relay-2, tested natively; the engine's network driver, the browser path and the live flow map are next. Install with `go install github.com/go-wasmcontainers/relay/cmd/wctr-relay@v0.1.0`."

[[params.repos]]
  name = "playground"
  status = "live"
  blurb = "An in-browser container playground: [a terminal that runs `wctr`](https://go-wasmcontainers.github.io/playground/) against WASI containers, with no server, for cloud and container training labs. `pull`, `run`, `ps`, `logs`, `rm`, `rmi`, `images`, `inspect`, `kill`, with the images `hello`, `greet`, `lab`, `age`, `go-md2man` and `shfmt` kept in the browser across reloads. No stdin, shell or networking yet. It has no release tag yet."

# What is planned, as one list so the page's counts are derived from it and
# never typed beside it.
[[params.planned]]
  name = "Networking"
  what = "Containers that listen and connect, through the WasmEdge socket ABI."

[[params.planned]]
  name = "Classroom relay"
  what = "The relay itself shipped in relay v0.1.0; planned: containers in the playground reaching each other through it (the engine's network driver and the browser path), the live flow map, and high availability across relays. [Relay docs](https://go-wasmcontainers.github.io/docs/latest/relay/), [design](https://go-wasmcontainers.github.io/docs/latest/design/classroom-network/)."

[[params.planned]]
  name = "A shell and exec"
  what = "`wctr exec` and an interactive shell, through a WASIX subset."

[[params.planned]]
  name = "Image build"
  what = "Building an image from a Dockerfile."

[[params.planned]]
  name = "Compose"
  what = "Several containers described in one file."

[[params.planned]]
  name = "A mini-Kubernetes"
  what = "Enough of the orchestrator's API to teach its concepts."

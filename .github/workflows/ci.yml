name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: the site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Hugo resolves the landingkit module (hugo.toml [module]) with the go
      # command, at the version go.mod pins.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true
      - run: hugo --minify
      # The hero's buttons are in the kit's order (docs, then try), and nothing
      # the mantra strip says is said twice. The checker is the one the landing's
      # go.mod pins: `go run` inside a module that requires landingkit uses it.
      - name: the page follows the kit's rules (landingkit check)
        run: go run github.com/go-fleettools/landingkit/cmd/landingkit check public
      # A page that builds and says nothing is a page nobody notices is empty.
      - name: every repository is on it
        run: |
          for repo in engine relay playground dashboard build compose shell gpu; do
            grep -q "go-wasmcontainers/$repo" public/index.html \
              || { echo "::error::$repo is not on the page"; exit 1; }
          done
          echo "the page names every repository this org has"
